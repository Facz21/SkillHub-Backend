services:
  postgres:
    image: postgres:16-alpine
    container_name: skillhub-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SkillHubDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SkillHubDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5076
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=SkillHubDb;Username=postgres;Password=postgres"
      Smtp__Host: "smtp.gmail.com"
      Smtp__Port: "587"
      Smtp__EnableSsl: "true"
      Smtp__FromName: "SkillHub — Plataforma de Talleres"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
    ports:
      - "5076:5076"

volumes:
  postgres_data:
